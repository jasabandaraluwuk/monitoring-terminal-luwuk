<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monitoring Terminal Bandara Luwuk</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#F5F7FA;--sf:#fff;--ink:#10243A;--mu:#64748B;--ln:#E3E8EE;--br:#1668C7;--brt:#E6F0FC;--ok:#178F63;--okt:#E3F5EC;--wn:#B87200;--wnt:#FDF1D8;--bd:#D03B3B;--bdt:#FCE6E6;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1622;--sf:#132133;--ink:#E8EEF5;--mu:#93A4B8;--ln:#22344A;--br:#5AA2F0;--brt:#16304D;--ok:#3CC08E;--okt:#12352A;--wn:#E5A82E;--wnt:#3A2F12;--bd:#EF6B6B;--bdt:#3D1B1F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1622;--sf:#132133;--ink:#E8EEF5;--mu:#93A4B8;--ln:#22344A;--br:#5AA2F0;--brt:#16304D;--ok:#3CC08E;--okt:#12352A;--wn:#E5A82E;--wnt:#3A2F12;--bd:#EF6B6B;--bdt:#3D1B1F;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:600px;margin:0 auto;padding:0 16px 110px}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;background:var(--bg);padding:calc(14px + env(safe-area-inset-top,0px)) 0 12px;margin-bottom:6px;border-bottom:1px solid var(--ln)}
.topbar img{height:34px;flex:none;object-fit:contain}
.topbar .tt{display:flex;flex-direction:column;line-height:1.2}
.topbar .tt b{font-size:14px;font-weight:800}
.topbar .tt span{font-size:11px;color:var(--mu)}
h1{font-size:22px;line-height:1.25;margin:0;font-weight:800;letter-spacing:-.01em}
h2{font-size:16px;margin:26px 0 10px;font-weight:700}
.sub{color:var(--mu);font-size:13px;margin:2px 0 0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--br);outline-offset:2px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px}
.ac{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:8px}
.ac .at{flex:1;display:flex;flex-direction:column}.ac small{color:var(--mu)}.chev{color:var(--mu);font-size:22px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--ln)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--wn)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.b{background:var(--okt);color:var(--ok)}.pill.p{background:var(--wnt);color:var(--wn)}.pill.r{background:var(--bdt);color:var(--bd)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border-bottom:0}.row small{color:var(--mu);display:block}
.tabs{display:flex;gap:6px;background:var(--brt);padding:4px;border-radius:12px;margin:16px 0}
.tabs button{flex:1;border:0;background:none;padding:9px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--mu)}
.tabs button.on{background:var(--sf);color:var(--br);box-shadow:0 1px 2px rgba(16,36,58,.12)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
input,textarea{width:100%;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;font-size:16px}
textarea{resize:vertical;min-height:84px}
.it{padding:12px 0;border-bottom:1px solid var(--ln)}.it:last-child{border-bottom:0}
.it>b{display:block;font-weight:600;margin-bottom:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:8px 2px;font-size:13px;font-weight:600;color:var(--mu)}
.seg button.on[data-s=b]{background:var(--okt);color:var(--ok);border-color:var(--ok)}
.seg button.on[data-s=p]{background:var(--wnt);color:var(--wn);border-color:var(--wn)}
.seg button.on[data-s=r]{background:var(--bdt);color:var(--bd);border-color:var(--bd)}
.itn{display:none;width:100%;margin-top:8px;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;font-size:13px;min-height:40px}
.itn.show{display:block}
.btn{width:100%;border:0;background:var(--br);color:#fff;font-weight:700;border-radius:12px;padding:14px;margin-top:16px}
.btn.o{background:var(--sf);color:var(--br);border:1px solid var(--br);margin-top:8px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px}
.stat b{display:block;font-size:24px;font-weight:800;line-height:1.2}.stat span{color:var(--mu);font-size:12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--ln);white-space:nowrap}th{color:var(--mu);font-weight:600}
.x{border:0;background:none;color:var(--mu);font-size:20px;padding:4px 8px}
.empty{color:var(--mu);text-align:center;padding:18px 8px;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav .in{display:flex;width:100%;max-width:600px}
nav button{flex:1;border:0;background:none;padding:8px 4px;font-size:12px;font-weight:600;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--br)}nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.sign{display:none}
.kop{display:none}
@media print{body{background:#fff;color:#000}nav,.noprint,#toast{display:none!important}main{padding:0;max-width:none}.card,.stat{border-color:#bbb;break-inside:avoid}.tw{break-inside:auto}.tw table{break-inside:auto}.tw tr{break-inside:avoid}.tw thead{display:table-header-group}h1,h2{break-after:avoid-page;page-break-after:avoid}.sign{display:block;margin-top:40px;text-align:right}.sign div{margin-top:64px;font-weight:700}.pill{border:1px solid #999;background:none!important;color:#000!important}
.kop{display:flex;align-items:center;gap:12px;border-bottom:3px solid #000;padding-bottom:10px;margin-bottom:14px}
.kop img{height:58px;flex:none;object-fit:contain}
.kop img.saa{height:50px}
.kop .kt{flex:1;text-align:center}
.kop .kt b{display:block;font-size:15px;letter-spacing:.2px}
.kop .kt small{display:block;font-size:12px;margin-top:1px}
.kop .ka{font-size:10px;line-height:1.3;border-left:1px solid #000;padding-left:8px;white-space:nowrap}
}
</style>
</head>

<main id="app"></main>
<nav class="noprint"><div class="in">
<button data-nav="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Beranda</button>
<button data-nav="input"><svg viewBox="0 0 24 24"><path d="M9 5h10M9 12h10M9 19h10M4 5l1 1 2-2M4 12l1 1 2-2M4 19l1 1 2-2"/></svg>Periksa</button>
<button data-nav="rekap"><svg viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5zM14 3v5h5M8 13h8M8 17h5"/></svg>Rekap</button>
</div></nav>

const FIREBASE_CONFIG={
 apiKey:"AIzaSyCekxMiohEgasfKryPd-kk6Lp2tlkwV0FQ",
 authDomain:"monitoring-terminal-luwuk.firebaseapp.com",

let fdb=null,fbReady=false;
function initFirebase(){
 if(!FIREBASE_CONFIG.apiKey||!FIREBASE_CONFIG.projectId)return;
 try{
  if(typeof firebase==='undefined'){console.warn('SDK Firebase gagal dimuat');return}
  firebase.initializeApp(FIREBASE_CONFIG);
  fdb=firebase.firestore();
  fdb.collection('pemeriksaan').onSnapshot(snap=>{
   E=snap.docs.map(d=>({id:d.id,...d.data()})).filter(e=>e.tgl&&e.jam&&e.area&&e.res);
   E.sort((a,b)=>(a.tgl+a.jam).localeCompare(b.tgl+b.jam));
   sv('tt_e',E); // cadangan lokal
   fbReady=true;
   try{render()}catch(e){console.error('Render error',e)}
  },err=>{console.error('Firestore error',err);toast('Gagal memuat data online: '+err.code)});
 }catch(e){console.error(e)}
}

const $=s=>document.querySelector(s);
let E=ld('tt_e',[]),S=ld('tt_s',{petugas:''});
let T={view:'home',area:'checkin',res:{},nt:{},month:dstr(new Date()).slice(0,7)},DL=null;
const bad=e=>Object.values(e.res||{}).filter(v=>v!=='b').length;
const fresh=()=>{T.res={};T.nt={};AREAS[T.area].i.forEach(k=>{T.res[k]='b';T.nt[k]=''})};
fresh();
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}
try{window.claude&&claude.use&&claude.use('downloads').then(d=>{DL=d;if(T.view==='rekap')render()}).catch(()=>{})}catch(e){}
initFirebase();

function home(){
 const now=new Date(),t=dstr(now);
 const cards=Object.keys(AREAS).map(k=>{
  const es=E.filter(e=>e.area===k&&e.tgl===t);let st='Belum diperiksa hari ini',c='';
  if(es.length){const b=bad(es[es.length-1]);st=(b?b+' fasilitas perlu tindakan':'Semua fasilitas baik')+' · '+es.length+'× hari ini';c=b?'warn':'ok'}
  return `<button class="ac" data-go="${k}"><span class="dot ${c}"></span><span class="at"><b>${AREAS[k].n}</b><small>${st}</small></span><span class="chev">›</span></button>`}).join('');
 const cur={};E.forEach(e=>{for(const k in e.res)cur[e.area+'|'+k]={a:e.area,i:k,v:e.res[k],t:e.tgl}});
 const open=Object.values(cur).filter(x=>x.v!=='b');
 const op=open.length?open.map(x=>`<div class="row"><div>${esc(x.i)}<small>${AREAS[x.a].s} · dicek ${x.t.split('-').reverse().join('/')}</small></div><span class="pill ${x.v}">${ST[x.v]}</span></div>`).join(''):'<div class="empty">Tidak ada fasilitas yang perlu tindakan.</div>';
 const rc=E.slice(-6).reverse().map(e=>{const b=bad(e);return `<div class="row"><div>${AREAS[e.area].n}<small>${e.tgl.split('-').reverse().join('/')} · ${e.jam} · ${b?b+' temuan':'semua baik'}</small></div><button class="x noprint" data-del="${e.id}" aria-label="Hapus">×</button></div>`}).join('')||'<div class="empty">Belum ada pemeriksaan. Mulai dari area di atas.</div>';
 return `<p class="sub" style="margin-top:14px">${now.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p>
 <h2>Periksa sekarang</h2>${cards}
 <h2>Perlu tindakan</h2><div class="card">${op}</div>
 <h2>Pemeriksaan terbaru</h2><div class="card">${rc}</div>`}

function input(){
 const a=AREAS[T.area],now=new Date();
 const tabs=Object.keys(AREAS).map(k=>`<button data-area="${k}" class="${k===T.area?'on':''}">${AREAS[k].s}</button>`).join('');
 const its=a.i.map((n,i)=>`<div class="it"><b>${esc(n)}</b><div class="seg" data-i="${i}">${Object.keys(ST).map(s=>`<button data-s="${s}" class="${T.res[n]===s?'on':''}">${ST[s]}</button>`).join('')}</div><textarea class="itn${T.res[n]!=='b'?' show':''}" data-note="${i}" placeholder="Catatan untuk ${esc(n)} (opsional)">${esc(T.nt[n]||'')}</textarea></div>`).join('');
 return `<h1>Periksa fasilitas</h1><p class="sub">Semua item diset Baik. Ubah yang bermasalah saja — catatan per item muncul otomatis.</p>
 <div class="tabs">${tabs}</div>
 <div class="f"><div><label for="d">Tanggal</label><input id="d" type="date" value="${dstr(now)}"></div><div><label for="j">Jam</label><input id="j" type="time" value="${p2(now.getHours())}:${p2(now.getMinutes())}"></div></div>
 <div class="card" style="margin-top:12px">${its}</div>
 <div style="margin-top:12px"><label for="pn">Jumlah penumpang (opsional)</label><input id="pn" type="number" inputmode="numeric" min="0" placeholder="0"></div>
 <div style="margin-top:12px"><label for="ct">Catatan umum (opsional)</label><textarea id="ct" placeholder="Catatan lain di luar daftar fasilitas di atas."></textarea></div>
 <button class="btn" data-save>Simpan pemeriksaan</button>`}

function rekap(){
 const m=T.month,es=E.filter(e=>e.tgl.startsWith(m));
 let chk=0,ok=0,pn=0;es.forEach(e=>{const v=Object.values(e.res);chk+=v.length;ok+=v.filter(x=>x==='b').length;pn+=+e.pnp||0});
 const pct=chk?Math.round(ok/chk*100):0;
 const lbl=new Date(m+'-01T00:00:00').toLocaleDateString('id-ID',{month:'long',year:'numeric'});
 const ringkasan=Object.keys(AREAS).map(k=>{
  const x=es.filter(e=>e.area===k);let c=0,o=0;
  x.forEach(e=>{for(const n in e.res){c++;if(e.res[n]==='b')o++}});
  return `<div class="row"><div>${AREAS[k].n}</div><div class="sub">${x.length} pemeriksaan · ${c?Math.round(o/c*100):0}% baik</div></div>`}).join('');
 const problems=[];
 Object.keys(AREAS).forEach(k=>{
  const is={};
  es.filter(e=>e.area===k).forEach(e=>{for(const n in e.res){const v=e.res[n];if(v!=='b'){const r=is[n]=is[n]||{p:0,r:0,notes:[]};r[v]++;if(e.itn&&e.itn[n])r.notes.push(e.itn[n])}}});
  Object.keys(is).forEach(n=>problems.push({area:AREAS[k].s,n,...is[n]}));
 });
 es.filter(e=>e.cat).forEach(e=>problems.push({area:AREAS[e.area].s,n:'Catatan umum',p:0,r:0,notes:[e.cat]}));
 const probList=problems.map(x=>`<div class="row" style="flex-direction:column;align-items:stretch"><div style="display:flex;justify-content:space-between"><b>${esc(x.n)}</b><span class="sub">${x.area}${x.p?` · <span class="pill p">Perhatian ${x.p}×</span>`:''}${x.r?` · <span class="pill r">Rusak ${x.r}×</span>`:''}</span></div>${x.notes.length?`<div class="sub" style="margin-top:3px">${x.notes.map(esc).join(' — ')}</div>`:''}</div>`).join('')||'<div class="empty">Tidak ditemukan permasalahan berarti selama bulan ini.</div>';
 const rows=es.map(e=>`<tr><td>${e.tgl.split('-').reverse().join('/')}</td><td>${e.jam}</td><td>${AREAS[e.area].s}</td><td>${bad(e)}</td><td>${e.pnp||'-'}</td></tr>`).join('');
 return `<div class="kop"><img src="${LOGO}" alt="Logo Kementerian Perhubungan"><div class="kt"><b>KEMENTERIAN PERHUBUNGAN</b><small>DIREKTORAT JENDERAL PERHUBUNGAN UDARA</small><small>KANTOR UPBKELAS II SYUKURAN AMINUDDIN AMIR LUWUK</small></div><img class="saa" src="${LOGO_SAA}" alt="Logo Bandar Udara Syukuran Aminuddin Amir Luwuk"></div>
 <h1>Laporan bulanan</h1><p class="sub">Monitoring fasilitas terminal · Bandara Syukuran Aminuddin Amir Luwuk<br>Periode ${lbl}</p>
 <div class="f noprint" style="margin-top:14px"><div><label for="mo">Bulan</label><input id="mo" type="month" value="${m}"></div><div><label for="pt">Nama petugas</label><input id="pt" value="${esc(S.petugas)}" placeholder="Nama lengkap"></div></div>
 <div class="f noprint" style="margin-top:10px"><div><label for="pnip">NIP petugas</label><input id="pnip" value="${esc(S.nip||'')}" placeholder="Contoh: 19850101 201001 1 001" inputmode="numeric"></div><div></div></div>
 <div class="stats"><div class="stat"><b>${es.length}</b><span>Pemeriksaan</span></div><div class="stat"><b>${pct}%</b><span>Fasilitas kondisi baik</span></div><div class="stat"><b>${chk-ok}</b><span>Total temuan</span></div><div class="stat"><b>${pn.toLocaleString('id-ID')}</b><span>Penumpang tercatat</span></div></div>
 <h2>Ringkasan per area</h2><div class="card">${ringkasan}</div>
 <h2>Permasalahan bulan ${lbl.split(' ')[0]}</h2><div class="card">${probList}</div>
 <h2 class="noprint">Log pemeriksaan <span style="font-size:11px;font-weight:400;color:var(--mu)">(tidak ikut tercetak)</span></h2><div class="card tw noprint">${rows?`<table><thead><tr><th>Tanggal</th><th>Jam</th><th>Area</th><th>Temuan</th><th>Pnp</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty">Belum ada data di bulan ini.</div>'}</div>
 <div class="sign">Luwuk, ${new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}<br>Petugas Tata Terminal<div>${esc(S.petugas||'(................................)')}${S.nip?`<br><span style="font-weight:400;font-size:12px">NIP. ${esc(S.nip)}</span>`:''}</div></div>
 <div class="btns noprint" style="margin-top:16px"><button class="btn o" data-print>Cetak / PDF</button>${DL?'<button class="btn o" data-csv>Unduh Excel (CSV)</button>':'<span></span>'}</div>`}

const TOPBAR=`<div class="topbar noprint"><img src="${LOGO}" alt="Logo Kementerian Perhubungan"><img src="${LOGO_SAA}" alt="Logo bandara"><div class="tt"><b>Monitoring Terminal</b><span>Bandara Syukuran Aminuddin Amir Luwuk</span></div></div>`;
function render(){
 $('#app').innerHTML=TOPBAR+(T.view==='home'?home():T.view==='input'?input():rekap());
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.nav===T.view));
 window.scrollTo(0,0)}

function csv(){
 const rows=[['Tanggal','Jam','Area','Fasilitas','Kondisi','Jumlah penumpang','Catatan']];
 E.filter(e=>e.tgl.startsWith(T.month)).forEach(e=>{for(const k in e.res)rows.push([e.tgl,e.jam,AREAS[e.area].n,k,ST[e.res[k]],e.pnp||'',e.cat||''])});
 return '\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n')}

document.addEventListener('click',async ev=>{
 const b=ev.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.nav){T.view=d.nav;render()}
 else if(d.go){T.view='input';T.area=d.go;fresh();render()}
 else if(d.area){T.area=d.area;fresh();render()}
 else if(d.s){const i=+b.parentElement.dataset.i,n=AREAS[T.area].i[i];T.res[n]=d.s;b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  const nt=b.closest('.it').querySelector('.itn');if(nt)nt.classList.toggle('show',d.s!=='b')}
 else if(d.save!==undefined){
  const tgl=$('#d').value,jam=$('#j').value;
  if(!tgl||!jam){toast('Isi tanggal dan jam dulu');return}
  const itn={};AREAS[T.area].i.forEach(n=>{if((T.nt[n]||'').trim())itn[n]=T.nt[n].trim()});
  const rec={tgl,jam,area:T.area,res:{...T.res},itn,pnp:$('#pn').value,cat:$('#ct').value.trim()};
  if(fdb){
   b.disabled=true;
   try{await fdb.collection('pemeriksaan').add(rec);toast('Pemeriksaan disimpan online')}
   catch(e){console.error(e);toast('Gagal simpan: '+(e.code||e.message))}
   b.disabled=false;
  }else{
   E.push({id:Date.now()+''+Math.floor(Math.random()*99),...rec});
   E.sort((a,b)=>(a.tgl+a.jam).localeCompare(b.tgl+b.jam));sv('tt_e',E);
   toast('Pemeriksaan disimpan di perangkat ini');
  }
  T.month=tgl.slice(0,7);T.view='home';render()}
 else if(d.del){if(confirm('Hapus pemeriksaan ini?')){
  if(fdb){try{await fdb.collection('pemeriksaan').doc(d.del).delete();toast('Pemeriksaan dihapus')}catch(e){toast('Gagal hapus online')}}
  else{E=E.filter(e=>e.id!==d.del);sv('tt_e',E);render();toast('Pemeriksaan dihapus')}
 }}
 else if(d.print!==undefined){try{window.print()}catch(e){toast('Cetak tidak tersedia di sini')}}
 else if(d.csv!==undefined&&DL){try{await DL.save({filename:'rekap-terminal-'+T.month+'.csv',data:csv()})}catch(e){toast('Unduhan dibatalkan')}}
});
document.addEventListener('change',ev=>{if(ev.target.id==='mo'&&ev.target.value){T.month=ev.target.value;render()}});
function syncSign(){
 const el=document.querySelector('.sign div');if(!el)return;
 el.innerHTML=esc(S.petugas||'(................................)')+(S.nip?`<br><span style="font-weight:400;font-size:12px">NIP. ${esc(S.nip)}</span>`:'');
}
document.addEventListener('input',ev=>{
 if(ev.target.id==='pt'){S.petugas=ev.target.value;sv('tt_s',S);syncSign()}
 else if(ev.target.id==='pnip'){S.nip=ev.target.value;sv('tt_s',S);syncSign()}
 else if(ev.target.dataset.note!==undefined){const n=AREAS[T.area].i[+ev.target.dataset.note];T.nt[n]=ev.target.value}
});
render();
</script>
</body>
</html>
